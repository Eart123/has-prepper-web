<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect fix
    // See: https://github.com/rafgraph/spa-github-pages
    (function() {
      var pathSegmentsToKeep = 1; // /has-prepper-web/
      var l = window.location;
      var newPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        l.search + l.hash;
      l.replace(newPath);
    })();
  </script>
</head>
<body>
  <p>Yönlendiriliyor...</p>
</body>
</html>

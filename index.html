    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function() {
        var l = window.location;
        if (l.search.indexOf('/?/') === 1) {
          var newPath = l.pathname + l.search.slice(3) + l.hash;
          l.replace(newPath);
          if (window.history.replaceState) {
            window.history.replaceState(null, '', newPath);
          }
        }
      })();
    </script>
